<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSD Field Mapper</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #13161a;
    --surface2: #1a1e24;
    --surface3: #21262e;
    --border: #2a303a;
    --border2: #353d49;
    --accent: #00d4aa;
    --accent-dim: rgba(0,212,170,0.12);
    --accent2: #4f9eff;
    --accent2-dim: rgba(79,158,255,0.12);
    --warn: #f59e0b;
    --warn-dim: rgba(245,158,11,0.12);
    --danger: #f87171;
    --success: #4ade80;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #4a5568;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    line-height: 1.6;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--text2); font-weight: 400; }
  .header-badge {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    color: var(--text3);
    letter-spacing: 0.08em;
  }

  /* Project selector */
  .project-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .proj-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text3);
    font-family: var(--mono);
    margin-right: 16px;
    text-transform: uppercase;
  }
  .proj-btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    padding: 14px 20px;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
    letter-spacing: 0.05em;
  }
  .proj-btn::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transition: transform 0.2s;
  }
  .proj-btn:hover { color: var(--text); }
  .proj-btn.active { color: var(--accent); }
  .proj-btn.active::after { transform: scaleX(1); }

  /* Extract tabs */
  .extract-tabs {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .extract-tabs::-webkit-scrollbar { display: none; }
  .etab {
    font-size: 12px;
    font-family: var(--sans);
    font-weight: 400;
    padding: 12px 18px;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    transition: color 0.2s;
    letter-spacing: 0.02em;
  }
  .etab::after {
    content: '';
    position: absolute;
    bottom: 0; left: 12px; right: 12px;
    height: 1.5px;
    background: var(--accent2);
    transform: scaleX(0);
    transition: transform 0.2s;
  }
  .etab:hover { color: var(--text2); }
  .etab.active { color: var(--accent2); font-weight: 500; }
  .etab.active::after { transform: scaleX(1); }

  /* Main layout */
  .main { padding: 20px 24px; max-width: 1400px; }

  /* Config row */
  .config-row {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .config-item { display: flex; align-items: center; gap: 10px; }
  .config-item label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text3);
    font-family: var(--mono);
    text-transform: uppercase;
  }
  select {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }
  select:hover { border-color: var(--accent); }
  select option { background: var(--surface2); }

  .status-chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    margin-left: auto;
  }
  .status-chip.ready { background: rgba(74,222,128,0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.2); }
  .status-chip.idle { background: var(--surface3); color: var(--text3); border: 1px solid var(--border); }

  /* Input panels */
  .panels-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 768px) { .panels-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .panel:focus-within { border-color: var(--border2); }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title.blue { color: var(--accent2); }
  .panel-hint {
    font-size: 11px;
    color: var(--text3);
    font-style: italic;
  }

  textarea {
    width: 100%;
    height: 200px;
    background: var(--surface);
    border: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    padding: 14px;
    resize: vertical;
    outline: none;
    display: block;
  }
  textarea::placeholder { color: var(--text3); font-style: italic; }

  .panel-footer {
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .line-count { font-family: var(--mono); font-size: 10px; color: var(--text3); }
  .clear-btn {
    font-family: var(--mono);
    font-size: 10px;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
    transition: color 0.2s, background 0.2s;
  }
  .clear-btn:hover { color: var(--danger); background: rgba(248,113,113,0.08); }

  .err-msg { font-family: var(--mono); font-size: 11px; color: var(--danger); padding: 6px 14px; background: rgba(248,113,113,0.06); border-top: 1px solid rgba(248,113,113,0.2); }

  /* Action row */
  .action-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .map-btn {
    background: var(--accent);
    color: #0d0f12;
    border: none;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 11px 28px;
    border-radius: 7px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .map-btn:hover { opacity: 0.88; }
  .map-btn:active { transform: scale(0.98); }
  .map-btn svg { width: 15px; height: 15px; }

  .secondary-btn {
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    font-family: var(--mono);
    font-size: 12px;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .secondary-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .secondary-btn svg { width: 14px; height: 14px; }

  /* Result area */
  .result-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .result-header {
    padding: 12px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .result-header-left { display: flex; align-items: center; gap: 10px; }
  .result-title { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text2); letter-spacing: 0.05em; }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }
  .tag-proj { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,212,170,0.2); }
  .tag-extract { background: var(--accent2-dim); color: var(--accent2); border: 1px solid rgba(79,158,255,0.2); }
  .tag-delim { background: var(--warn-dim); color: var(--warn); border: 1px solid rgba(245,158,11,0.2); }
  .field-count { font-family: var(--mono); font-size: 11px; color: var(--text3); }

  .result-body { padding: 0; overflow-x: auto; }

  /* Table */
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 12px;
  }
  thead { background: var(--surface3); }
  th {
    text-align: left;
    padding: 10px 14px;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text3);
    text-transform: uppercase;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text2);
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .td-name { color: var(--text); font-weight: 500; }
  .td-pos { color: var(--accent); }
  .td-val { color: var(--success); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-val.empty-val { color: var(--text3); font-style: italic; }
  .td-type span {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.05em;
  }
  .type-pos { background: var(--accent-dim); color: var(--accent); }
  .type-pipe { background: var(--warn-dim); color: var(--warn); }
  .type-delim { background: var(--accent2-dim); color: var(--accent2); }
  .td-desc { color: var(--text3); font-size: 11px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .row-num { color: var(--text3); font-size: 11px; text-align: right; width: 32px; }

  /* Empty state */
  .empty-state {
    padding: 48px 24px;
    text-align: center;
    color: var(--text3);
  }
  .empty-state svg { width: 40px; height: 40px; margin: 0 auto 16px; display: block; opacity: 0.3; }
  .empty-state p { font-family: var(--mono); font-size: 13px; }
  .empty-state span { font-size: 12px; display: block; margin-top: 6px; opacity: 0.6; }

  /* Footer actions */
  .result-footer {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-end;
  }
  .export-btn {
    font-family: var(--mono);
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 5px;
    border: 1px solid var(--border2);
    background: none;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }
  .export-btn svg { width: 12px; height: 12px; }

  /* Tooltip on truncated value */
  .td-val[title] { cursor: help; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">FSD<span>/</span>MAPPER</div>
    <div class="header-badge">EXTRACT TOOL</div>
  </div>
  <div id="globalStatus" class="status-chip idle">IDLE</div>
</div>

<div class="project-bar">
  <span class="proj-label">Project:</span>
  <button class="proj-btn active" onclick="setProject('MMEX',this)">MMEX</button>
  <button class="proj-btn" onclick="setProject('AAX',this)">AAX</button>
  <button class="proj-btn" onclick="setProject('MMBC',this)">MMBC</button>
</div>

<div class="extract-tabs">
  <button class="etab active" onclick="setExtract('Account Extract',this)">Account Extract</button>
  <button class="etab" onclick="setExtract('Statement Extract',this)">Statement Extract</button>
  <button class="etab" onclick="setExtract('Transaction Extract',this)">Transaction Extract</button>
  <button class="etab" onclick="setExtract('Customer Extract',this)">Customer Extract</button>
  <button class="etab" onclick="setExtract('Exception Extract',this)">Exception Extract</button>
</div>

<div class="main">
  <div class="config-row">
    <div class="config-item">
      <label>Delimiter</label>
      <select id="delimSelect">
        <option value="pipe">Pipe ( | )</option>
        <option value="position">Fixed Position</option>
        <option value="comma">Comma ( , )</option>
        <option value="tab">Tab delimited</option>
      </select>
    </div>
    <div class="config-item">
      <label>FSD header row</label>
      <select id="headerRow">
        <option value="0">No header (data starts row 1)</option>
        <option value="1">Skip 1 header row</option>
      </select>
    </div>
  </div>

  <div class="panels-grid">
    <div class="panel" id="fsdPanel">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><rect x="1" y="1" width="14" height="14" rx="2"/><line x1="4" y1="5" x2="12" y2="5"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="4" y1="11" x2="9" y2="11"/></svg>
          FSD / Mapping Doc
        </div>
        <span class="panel-hint">paste from Excel</span>
      </div>
      <textarea id="fsdInput"
        placeholder="Paste FSD mapping from Excel here.&#10;&#10;Expected columns (tab or pipe separated):&#10;  Field Name  |  Start  |  End  |  Length  |  Description&#10;&#10;Examples:&#10;&#10;Fixed position:&#10;  Account Number    1    10    10    Unique account ID&#10;  Customer Name    11    30    20    Full customer name&#10;  Balance          31    40    10    Current balance&#10;&#10;Pipe delimited:&#10;  Account Number|1|10|10|Unique account ID&#10;  Customer Name|11|30|20|Full customer name"
        oninput="updateCount('fsdInput','fsdCount')"
      ></textarea>
      <div class="panel-footer">
        <span class="line-count" id="fsdCount">0 lines</span>
        <button class="clear-btn" onclick="clearPanel('fsdInput','fsdCount','fsdErr')">clear</button>
      </div>
      <div id="fsdErr" style="display:none"></div>
    </div>

    <div class="panel" id="recPanel">
      <div class="panel-header">
        <div class="panel-title blue">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" width="14" height="14"><path d="M2 2h12v12H2z"/><path d="M2 6h12M2 10h12M6 2v12"/></svg>
          Extract Record
        </div>
        <span class="panel-hint">paste raw record line</span>
      </div>
      <textarea id="recordInput"
        placeholder="Paste the raw extract record line here.&#10;&#10;Pipe-delimited example:&#10;  1234567890|John Smith|0000500.00|ACTIVE|...&#10;&#10;Fixed-position example:&#10;  1234567890John Smith          0000500.00ACTIVE"
        oninput="updateCount('recordInput','recCount')"
      ></textarea>
      <div class="panel-footer">
        <span class="line-count" id="recCount">0 chars</span>
        <button class="clear-btn" onclick="clearPanel('recordInput','recCount','recErr')">clear</button>
      </div>
      <div id="recErr" style="display:none"></div>
    </div>
  </div>

  <div class="action-row">
    <button class="map-btn" onclick="doMap()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 8h14M9 3l6 5-6 5"/>
      </svg>
      Map Fields
    </button>
    <button class="secondary-btn" onclick="loadSample()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="8"/><line x1="8" y1="8" x2="10" y2="10"/></svg>
      Load Sample
    </button>
    <button class="secondary-btn" onclick="resetAll()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8A6 6 0 1 1 8 2"/><polyline points="2 2 2 8 8 8"/></svg>
      Reset
    </button>
  </div>

  <div class="result-wrap">
    <div class="result-header">
      <div class="result-header-left">
        <span class="result-title">MAPPED OUTPUT</span>
        <span class="tag tag-proj" id="tagProj">MMEX</span>
        <span class="tag tag-extract" id="tagExtract">Account Extract</span>
        <span class="tag tag-delim" id="tagDelim">PIPE</span>
      </div>
      <span class="field-count" id="fieldCount">— fields</span>
    </div>
    <div class="result-body" id="resultBody">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="3" y1="15" x2="21" y2="15"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
        <p>No mapping yet</p>
        <span>Paste FSD and extract record above, then click Map Fields</span>
      </div>
    </div>
    <div class="result-footer" id="resultFooter" style="display:none">
      <button class="export-btn" onclick="copyCSV()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><line x1="5" y1="8" x2="11" y2="8"/><line x1="8" y1="5" x2="8" y2="11"/></svg>
        Copy CSV
      </button>
      <button class="export-btn" onclick="copyJSON()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4 C2 4 2 7 4 7 C2 7 2 10 4 10"/><path d="M12 4 C14 4 14 7 12 7 C14 7 14 10 12 10"/><circle cx="8" cy="8" r="1"/></svg>
        Copy JSON
      </button>
      <button class="export-btn" onclick="downloadCSV()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v7m0 0l-3-3m3 3l3-3"/><path d="M3 13h10"/></svg>
        Download CSV
      </button>
    </div>
  </div>
</div>

<script>
let activeProject = 'MMEX';
let activeExtract = 'Account Extract';
let lastFields = [], lastValues = [];

function setProject(p, el) {
  activeProject = p;
  document.querySelectorAll('.proj-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tagProj').textContent = p;
}

function setExtract(e, el) {
  activeExtract = e;
  document.querySelectorAll('.etab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tagExtract').textContent = e;
}

function updateCount(textareaId, countId) {
  const val = document.getElementById(textareaId).value;
  const el = document.getElementById(countId);
  if (textareaId === 'fsdInput') {
    const lines = val.trim() ? val.trim().split(/\r?\n/).length : 0;
    el.textContent = lines + ' line' + (lines !== 1 ? 's' : '');
  } else {
    el.textContent = val.length + ' char' + (val.length !== 1 ? 's' : '');
  }
}

function clearPanel(tid, cid, eid) {
  document.getElementById(tid).value = '';
  document.getElementById(cid).textContent = tid === 'fsdInput' ? '0 lines' : '0 chars';
  hideErr(eid);
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  el.className = 'err-msg';
  el.textContent = '⚠ ' + msg;
}
function hideErr(id) {
  const el = document.getElementById(id);
  el.style.display = 'none';
}

function detectSep(line) {
  if (line.includes('|')) return '|';
  if (line.includes('\t')) return '\t';
  if (line.includes(',')) return ',';
  return null;
}

function parseFSD(raw, delimMode, skipHeader) {
  let lines = raw.trim().split(/\r?\n/).filter(l => l.trim());
  if (skipHeader && lines.length > 1) lines = lines.slice(1);
  const fields = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    let parts;
    if (delimMode === 'position') {
      parts = line.trim().split(/\t|\s{2,}/).map(p => p.trim()).filter(Boolean);
    } else {
      const sep = delimMode === 'pipe' ? '|' : delimMode === 'comma' ? ',' : '\t';
      parts = line.split(sep).map(p => p.trim());
    }
    if (parts.length < 2) continue;
    const name = parts[0];
    const start = parseInt(parts[1]);
    const end = parts[2] ? parseInt(parts[2]) : null;
    const len = parts[3] ? parseInt(parts[3]) : (!isNaN(end) && !isNaN(start) ? end - start + 1 : null);
    const desc = parts[4] || parts[3] || '';
    if (name && !isNaN(start)) fields.push({ name, start, end, len, desc: isNaN(desc) ? desc : '' });
  }
  return fields;
}

function extractValues(record, fields, delimMode) {
  if (delimMode === 'position') {
    return fields.map(f => {
      const s = Math.max(0, f.start - 1);
      const e = f.end ? f.end : (f.len ? s + f.len : record.length);
      return record.substring(s, e);
    });
  } else {
    const sep = delimMode === 'pipe' ? '|' : delimMode === 'comma' ? ',' : '\t';
    const parts = record.split(sep);
    return fields.map((_, i) => parts[i] !== undefined ? parts[i] : '');
  }
}

function doMap() {
  const fsdRaw = document.getElementById('fsdInput').value;
  const recRaw = document.getElementById('recordInput').value;
  const delimMode = document.getElementById('delimSelect').value;
  const skipHeader = document.getElementById('headerRow').value === '1';
  hideErr('fsdErr'); hideErr('recErr');

  if (!fsdRaw.trim()) { showErr('fsdErr', 'Please paste FSD / mapping doc content.'); return; }
  if (!recRaw.trim()) { showErr('recErr', 'Please paste extract record line.'); return; }

  const fields = parseFSD(fsdRaw, delimMode, skipHeader);
  if (!fields.length) {
    showErr('fsdErr', 'Could not parse any fields. Check the format and delimiter selection.');
    return;
  }

  const values = extractValues(recRaw.trim(), fields, delimMode);
  lastFields = fields; lastValues = values;

  const delimLabels = { pipe: 'PIPE', position: 'POSITION', comma: 'COMMA', tab: 'TAB' };
  document.getElementById('tagDelim').textContent = delimLabels[delimMode] || delimMode.toUpperCase();
  document.getElementById('fieldCount').textContent = fields.length + ' fields';

  const typeClass = delimMode === 'position' ? 'type-pos' : delimMode === 'pipe' ? 'type-pipe' : 'type-delim';
  const typeLabel = delimMode === 'position' ? 'POS' : delimMode === 'pipe' ? 'PIPE' : delimMode.toUpperCase();

  let rows = '';
  fields.forEach((f, i) => {
    const val = values[i] !== undefined ? values[i].trim() : '';
    const posInfo = delimMode === 'position'
      ? `<span class="td-pos">${f.start}–${f.end || (f.start + (f.len||1) - 1)}</span>`
      : `<span style="color:var(--text3)">col ${i + 1}</span>`;
    const valDisplay = val
      ? `<span class="td-val" title="${val.replace(/"/g,'&quot;')}">${escHtml(val)}</span>`
      : `<span class="td-val empty-val">(empty)</span>`;
    rows += `<tr>
      <td class="row-num">${i + 1}</td>
      <td class="td-name">${escHtml(f.name)}</td>
      <td>${posInfo}</td>
      <td>${valDisplay}</td>
      <td class="td-type"><span class="${typeClass}">${typeLabel}</span></td>
      <td class="td-desc" title="${escHtml(f.desc)}">${escHtml(f.desc)}</td>
    </tr>`;
  });

  document.getElementById('resultBody').innerHTML = `
    <table>
      <thead><tr>
        <th>#</th>
        <th>Field Name</th>
        <th>Position / Column</th>
        <th>Extracted Value</th>
        <th>Type</th>
        <th>Description</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  document.getElementById('resultFooter').style.display = 'flex';
  document.getElementById('globalStatus').className = 'status-chip ready';
  document.getElementById('globalStatus').textContent = 'MAPPED';
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toCSV() {
  let csv = 'No,Field Name,Position/Column,Extracted Value,Description\n';
  const delimMode = document.getElementById('delimSelect').value;
  lastFields.forEach((f, i) => {
    const pos = delimMode === 'position' ? `${f.start}-${f.end||''}` : `col ${i+1}`;
    const val = (lastValues[i]||'').trim();
    csv += `${i+1},"${f.name}","${pos}","${val.replace(/"/g,'""')}","${(f.desc||'').replace(/"/g,'""')}"\n`;
  });
  return csv;
}

function copyCSV() {
  navigator.clipboard.writeText(toCSV()).then(() => flashBtn(event.target, 'Copied!'));
}

function copyJSON() {
  const delimMode = document.getElementById('delimSelect').value;
  const obj = lastFields.map((f, i) => ({
    index: i + 1,
    field: f.name,
    position: delimMode === 'position' ? { start: f.start, end: f.end } : { column: i + 1 },
    value: (lastValues[i]||'').trim(),
    description: f.desc || ''
  }));
  navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).then(() => flashBtn(event.target, 'Copied!'));
}

function downloadCSV() {
  const blob = new Blob([toCSV()], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${activeProject}_${activeExtract.replace(/\s+/g,'_')}_mapped.csv`;
  a.click();
}

function flashBtn(el, msg) {
  const orig = el.innerHTML;
  el.textContent = msg;
  setTimeout(() => { el.innerHTML = orig; }, 1600);
}

function resetAll() {
  document.getElementById('fsdInput').value = '';
  document.getElementById('recordInput').value = '';
  document.getElementById('fsdCount').textContent = '0 lines';
  document.getElementById('recCount').textContent = '0 chars';
  hideErr('fsdErr'); hideErr('recErr');
  document.getElementById('resultBody').innerHTML = `<div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    <p>No mapping yet</p><span>Paste FSD and extract record above, then click Map Fields</span></div>`;
  document.getElementById('resultFooter').style.display = 'none';
  document.getElementById('fieldCount').textContent = '— fields';
  document.getElementById('globalStatus').className = 'status-chip idle';
  document.getElementById('globalStatus').textContent = 'IDLE';
  lastFields = []; lastValues = [];
}
